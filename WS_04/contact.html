<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>
  <main>
    <p>If you have any questions or inquiries, please feel free to reach out to us using the form below. We will get back to you as soon as possible.</p>
  </main>
<section id="contact">
  <h1>Contact Us</h1>
  <p>Would you Like to Get in Contact with Us? Fill out the form below!</p>

  <form id="contactForm">
    <table>
      <tr>
        <td><label for="name">Name:</label></td>
        <td><input type="text" id="name" name="name" placeholder="Your Name"></td>
      </tr>
      <tr>
        <td><label for="email">Email:</label></td>
        <td><input type="email" id="email" name="email" placeholder="Your Email"></td>
      </tr>
      <tr>
        <td><label for="message">Message:</label></td>
        <td><textarea id="message" name="message" placeholder="Your Message"></textarea></td>
      </tr>
      <tr>
        <td colspan="2" style="text-align:center;">
          <button class="transition-button">Submit</button>
        </td>
      </tr>
    </table>
  </form>
</section>
<footer>
  <p>© 2026 Lola | All rights reserved.</p>
  </footer>
</body>
